    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #bfb8ae; }
      @keyframes fade-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      .fade-up { animation: fade-up 0.6s ease both; }
      .hover-lift { transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s; }
      .hover-lift:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.12); border-color: #d14200 !important; }
      .hover-accent { transition: all 0.18s; }
      .hover-accent:hover { background: #d14200 !important; color: #fff !important; border-color: #d14200 !important; }
      @media (prefers-reduced-motion: reduce) {
        .fade-up { animation: none; }
        .hover-lift, .hover-accent { transition: none; }
        .hover-lift:hover { transform: none; }
      }
